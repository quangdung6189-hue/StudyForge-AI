[build]
  command = "npm run db:generate && npm run build --workspace @studyforge/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "MAIL_TRANSPORT,MAX_UPLOAD_BYTES,AUTH_RATE_LIMIT_PER_15_MIN,AI_TIMEOUT_MS,UPLOAD_RATE_LIMIT_PER_15_MIN,AI_RATE_LIMIT_PER_15_MIN,ATTEMPT_RATE_LIMIT_PER_15_MIN,COOKIE_SECURE,SESSION_TTL_DAYS,AUTH_BCRYPT_ROUNDS,PRIVATE_STORAGE_DIR,MAX_UPLOAD_FILES,PORT,APP_URL,AI_MODEL_GENERATE,AI_MODEL_REVIEW"
