[build]
  command = "npm run db:generate && npm run build --workspace @studyforge/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  # Endpoint URLs and model IDs are public configuration and also appear in
  # documentation, tests, and server defaults. Keep credential scanning enabled.
  SECRETS_SCAN_OMIT_KEYS = "AI_BASE_URL,AI_MODEL_GENERATE,AI_MODEL_REVIEW"
